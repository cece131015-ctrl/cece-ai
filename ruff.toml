# CeceHub tiene que funcionar con Python 3.8 y solo con la biblioteca estándar.
# Las reglas se fijan aquí para que «npm run lint» dé lo mismo con cualquier versión de ruff
# (las versiones nuevas activan por defecto reglas de estilo que no aplican a 3.8).
target-version = "py38"

[lint]
select = ["E4", "E7", "E9", "F"]
