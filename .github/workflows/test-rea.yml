name: Test Cece AI and REA
on:
  push:
    branches: ["fix/rea-functional-2026-10-17"]
  pull_request:
    branches: ["main", "master", "integracion/rea-slash-command"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
