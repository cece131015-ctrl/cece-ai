<style>
/* ===============================================================
   CECE AI — hoja de estilos
   =============================================================== */
:root{
  --bg:#000;
  --panel:#111014;
  --panel-2:#17151b;
  --panel-3:#0a090c;
  --border:#2a2830;
  --border-2:#3a3742;
  --text:#f2f0f5;
  --text-dim:#9a97a3;
  --pink:#ff3f9e;
  --purple:#7c3aed;
  --purple-2:#6d28d9;
  --green:#22c55e;
  --red:#ef4444;
  --accent:#ff3f9e;
  --muelle:cubic-bezier(.34,1.56,.48,1);
  --suave:cubic-bezier(.22,.9,.35,1);
}

*{box-sizing:border-box;margin:0;padding:0;}
::selection{background:var(--accent);color:#0a090c;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(124,58,237,.10), transparent 62%),
    radial-gradient(900px 520px at 92% 4%, rgba(255,63,158,.07), transparent 58%),
    var(--bg);
  color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;}
input,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------------- CABECERA ---------------- */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;position:relative;z-index:60;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.brand{
  font-size:24px;font-weight:900;color:#fff;
  margin-right:auto;white-space:nowrap;cursor:default;
  display:flex;align-items:center;
}
.brand .ltr{display:inline-block;}
.brand .esp{width:.32em;}

.model-selector-wrap{position:relative;}
.model-pill{
  display:flex;align-items:center;gap:9px;
  background:linear-gradient(180deg,#1b0f18,#150c14);
  border:1px solid var(--accent);
  border-radius:12px;padding:9px 15px;
  cursor:pointer;font-size:14px;position:relative;z-index:1;
  transition:border-color .3s var(--suave);
}
.model-pill::after{
  content:"";position:absolute;inset:-2px;border-radius:14px;
  pointer-events:none;box-shadow:0 0 22px var(--accent);
  opacity:.3;will-change:opacity;
}
.model-pill #currentModelLabel{
  color:var(--accent);font-weight:700;letter-spacing:.4px;
  transition:color .3s var(--suave);
}
.bolt{color:var(--accent);transition:color .3s var(--suave);}

.badge{
  font-size:11px;font-weight:700;padding:3px 8px;
  border-radius:6px;white-space:nowrap;display:inline-block;
}
.badge-new{background:#3b1d33;color:#ff8fc7;border:1px solid #5c2a4a;}
.badge-creative{background:#1d2f3b;color:#7fd0ff;border:1px solid #2a4a5c;}
.badge-ultra{background:#3b331d;color:#ffd97f;border:1px solid #5c4e2a;}
.badge-turbo{background:#1d3b2a;color:#7fffb0;border:1px solid #2a5c3f;}
.badge-nova{background:#232a3b;color:#a8c4ff;border:1px solid #3a4a6c;}
.badge-plus{background:#3b331d;color:#ffd9a0;border:1px solid #5c4e2a;}
.badge-mini{background:#1d2a3b;color:#8ab4f8;border:1px solid #2a3f5c;}
.badge-code{background:#2e2340;color:#d3b8ff;border:1px solid #4a3a6c;}

.model-dropdown{
  display:none;position:absolute;top:calc(100% + 8px);right:0;
  width:340px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;padding:9px;
  box-shadow:0 24px 60px rgba(0,0,0,.75);
  max-height:74vh;overflow-y:auto;
}
.model-dropdown.open{display:block;}
.dropdown-section-title{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:var(--text-dim);
  padding:8px 10px;letter-spacing:.4px;
}
.dropdown-item{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:transparent;border:none;border-radius:10px;
  padding:10px;cursor:pointer;text-align:left;position:relative;overflow:hidden;
}
.dropdown-item:hover,.dropdown-item:focus-visible{background:var(--panel-2);}
.dropdown-item.oculto{display:none;}
.dropdown-item.sel{background:var(--panel-2);}
.item-row{display:flex;align-items:center;min-width:0;}
.dot-color{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:9px;}
.item-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.item-name{font-weight:600;font-size:14px;}
.item-sub{font-size:12px;color:var(--text-dim);}

.icon-btn{
  background:var(--panel);border:1px solid var(--border);
  color:var(--text-dim);padding:9px 13px;border-radius:12px;
  cursor:pointer;font-size:14px;white-space:nowrap;
  position:relative;overflow:hidden;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-2);}
.ico-gear,.ico-trash{display:inline-block;}

/* ---------------- AJUSTES ---------------- */
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;}
.settings-overlay.open{display:flex;justify-content:flex-end;}
.settings-panel{
  width:430px;max-width:94vw;height:100%;
  background:var(--panel);border-left:1px solid var(--border);
  box-shadow:-24px 0 60px rgba(0,0,0,.55);
  padding:20px;overflow-y:auto;
}
.settings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.settings-header h2{font-size:20px;}
.close-settings{background:transparent;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;padding:4px 9px;border-radius:8px;}
.close-settings:hover{color:var(--text);background:var(--panel-2);}
.settings-body h3{font-size:15px;margin-bottom:6px;color:#fff;}
.settings-hint{font-size:12.5px;color:var(--text-dim);margin-bottom:13px;line-height:1.45;}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0;}
code{background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12px;font-family:Consolas,Monaco,monospace;}

.esfuerzo-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.esf-btn{
  flex:1;min-width:52px;background:var(--panel-2);border:1px solid var(--border);
  color:var(--text-dim);padding:9px 3px;border-radius:8px;cursor:pointer;
  font-size:12px;position:relative;overflow:hidden;
}
.esf-btn:hover{border-color:var(--border-2);color:var(--text);}
.esf-btn.on{background:var(--accent);border-color:var(--accent);color:#0a090c;font-weight:700;}
.esf-btn.esf-ancho{flex-basis:100%;background:#12241a;border-color:#2a5c3f;color:#7fffb0;}
.esf-btn.esf-ancho.on{background:#7fffb0;border-color:#7fffb0;color:#0a090c;}

.preset-row{display:flex;gap:6px;margin-bottom:10px;}
.preset-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
  padding:7px 3px;border-radius:8px;cursor:pointer;font-size:11.5px;
  position:relative;overflow:hidden;
}
.preset-btn span{font-size:10px;opacity:.65;}
.preset-btn:hover{border-color:var(--border-2);color:var(--text);}
.preset-btn.on{background:var(--pink);border-color:var(--pink);color:#0a090c;font-weight:700;}
.preset-btn.on span{opacity:.8;}

.rep-fila{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.rep-nom{font-size:12.5px;width:78px;flex-shrink:0;}
.rep-pct{font-size:12.5px;flex-shrink:0;color:var(--text-dim);display:flex;align-items:center;gap:2px;}
.reparto-slider{width:100%;accent-color:#c9a0ff;}
.speed-row{display:flex;align-items:center;gap:14px;}
.speed-row input[type=range]{flex:1;accent-color:var(--accent);}
.speed-num{font-size:13px;color:var(--pink);font-weight:700;display:flex;align-items:center;gap:3px;flex-shrink:0;}
.num-in{
  width:46px;background:var(--panel-3);border:1px solid var(--border);
  color:var(--text);border-radius:6px;padding:4px 5px;font-size:12.5px;
  text-align:right;-moz-appearance:textfield;
}
.num-in.ancho{width:58px;color:var(--pink);font-weight:700;}
.num-in:focus{outline:none;border-color:var(--purple);}
.num-in::-webkit-outer-spin-button,.num-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.switch-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;font-size:13.5px;}
.switch-fila label{cursor:pointer;line-height:1.35;}
.sw{position:relative;width:44px;height:24px;flex-shrink:0;}
.sw input{opacity:0;width:0;height:0;}
.sw-pista{
  position:absolute;inset:0;background:var(--panel-2);border:1px solid var(--border);
  border-radius:24px;cursor:pointer;transition:background .25s var(--suave),border-color .25s var(--suave);
}
.sw-pista::before{
  content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;
  background:var(--text-dim);border-radius:50%;
  transition:transform .28s var(--muelle),background .25s var(--suave);
}
.sw input:checked + .sw-pista{background:var(--accent);border-color:var(--accent);}
.sw input:checked + .sw-pista::before{transform:translateX(20px);background:#0a090c;}

.btn-secondary{
  width:100%;background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);padding:11px;border-radius:10px;cursor:pointer;
  font-size:13px;margin-top:8px;position:relative;overflow:hidden;
}
.btn-secondary:hover{border-color:var(--border-2);}
.save-status{margin-top:9px;font-size:13px;color:var(--green);min-height:16px;line-height:1.4;}
.conv-list{margin:10px 0;display:flex;flex-direction:column;gap:5px;max-height:230px;overflow-y:auto;}
.conv-row{display:flex;gap:5px;}
.conv-load{
  flex:1;text-align:left;background:var(--panel-3);border:1px solid var(--border);
  color:var(--text);padding:9px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.conv-load:hover{border-color:var(--accent);}
.conv-del{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);width:34px;border-radius:8px;cursor:pointer;}
.conv-del:hover{color:#ff9a9a;border-color:#5c2a2a;}
.buscador{
  width:100%;background:var(--panel-3);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:9px;font-size:12.5px;margin-top:9px;
  transition:border-color .2s var(--suave);
}
.buscador:focus{outline:none;border-color:var(--accent);}
.conv-vacio{font-size:12px;color:var(--text-dim);padding:9px 2px;}
.buscador{width:100%;background:var(--panel-3);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:9px;font-size:13px;margin-top:8px;}
.buscador:focus{outline:none;border-color:var(--purple);}
.aviso{
  border-radius:9px;padding:11px;font-size:12px;line-height:1.5;margin-top:9px;
}
.aviso-naranja{background:#1a1416;border:1px solid #4a3a2a;color:#ffcf9a;}
.aviso-verde{background:#12241a;border:1px solid #2a5c3f;color:#a8e6c0;}
.aviso-morado{background:#1a1424;border:1px solid #3a2a5c;color:#d3b8ff;}
img.emo{
  width:1.2em;height:1.2em;vertical-align:-0.22em;display:inline-block;
  margin:0 .02em;pointer-events:none;user-select:none;
}
.emoji-estilos{display:flex;gap:7px;margin-bottom:4px;}
.emo-opt{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
  background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
  padding:11px 6px 9px;border-radius:11px;cursor:pointer;font-size:12px;
  position:relative;overflow:hidden;
  transition:border-color .2s var(--suave),color .2s var(--suave),background .2s var(--suave),transform .15s var(--muelle);
}
.emo-opt:hover{border-color:var(--border-2);color:var(--text);transform:translateY(-2px);}
.emo-opt.on{border-color:var(--accent);color:var(--text);background:#1b0f18;box-shadow:0 0 0 1px var(--accent) inset;}
.emo-prev{font-size:18px;display:flex;gap:4px;align-items:center;justify-content:center;height:24px;line-height:1;}
.emo-prev img.emo{width:20px;height:20px;vertical-align:middle;margin:0;}
.carpeta-lista{
  display:flex;flex-wrap:wrap;gap:5px;margin:9px 0;
}
.carpeta-chip{
  font-size:11px;background:var(--panel-3);border:1px solid var(--border);
  color:var(--text-dim);padding:4px 9px;border-radius:20px;
}
.carpeta-chip b{color:var(--text);font-weight:600;}

/* ---------------- CHAT ---------------- */
.chat-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;scroll-behavior:smooth;}
.messages{display:flex;flex-direction:column;gap:15px;max-width:920px;width:100%;margin:0 auto;}
.msg{display:flex;gap:11px;align-items:flex-start;}
.avatar{
  width:36px;height:36px;border-radius:11px;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
}
.bot-msg .avatar{background:linear-gradient(135deg,var(--purple),var(--accent));transition:background .3s var(--suave);}
.user-msg{flex-direction:row-reverse;}
.user-msg .avatar{background:#2a2830;}
.msg-body{min-width:0;max-width:100%;}
.bubble{
  background:linear-gradient(180deg,#141218,var(--panel));
  border:1px solid var(--border);
  padding:13px 17px;border-radius:16px;font-size:15px;line-height:1.62;
  max-width:74ch;overflow-wrap:break-word;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}
.user-msg .bubble{
  background:linear-gradient(135deg,#2a1d3d,#1e1528);
  border-color:#42305f;white-space:pre-wrap;
  box-shadow:0 2px 12px rgba(124,58,237,.16);
}
.bubble.err{border-color:#5c2a2a;color:#ff9a9a;white-space:pre-wrap;}
.bubble.thinking{display:flex;gap:6px;align-items:center;}
.pensando{
  font-size:14px;font-weight:600;margin-right:3px;
  background:linear-gradient(90deg,var(--text-dim) 25%,#fff 50%,var(--text-dim) 75%);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.dot{width:6px;height:6px;background:var(--text-dim);border-radius:50%;will-change:transform,opacity;}
.user-meta{justify-content:flex-end;}
.msg-meta{
  font-size:11px;color:var(--text-dim);margin-top:6px;
  display:flex;gap:9px;flex-wrap:wrap;align-items:center;
}
.mini-btn{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  font-size:10.5px;padding:2px 8px;border-radius:5px;cursor:pointer;
}
.mini-btn:hover{color:var(--text);border-color:var(--border-2);}

/* Markdown */
.bubble p{margin:0 0 9px;}
.bubble p:last-child{margin-bottom:0;}
.bubble h3{font-size:16px;font-weight:700;margin:13px 0 7px;color:#fff;}
.bubble h3:first-child{margin-top:0;}
.bubble ul,.bubble ol{margin:0 0 9px;padding-left:22px;}
.bubble li{margin-bottom:3px;}
.bubble strong{color:#fff;font-weight:700;}
.bubble em{font-style:italic;}
.bubble a{color:var(--accent);}
.bubble code.inline{
  background:var(--panel-3);border:1px solid var(--border);border-radius:4px;
  padding:1px 5px;font-family:Consolas,Monaco,monospace;font-size:13px;color:#ffd9ec;
}
.bubble table{
  width:100%;border-collapse:collapse;margin:0 0 10px;font-size:13.5px;
  display:block;overflow-x:auto;
}
.bubble th,.bubble td{
  border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top;
}
.bubble th{background:var(--panel-2);color:#fff;font-weight:700;white-space:nowrap;}
.bubble tbody tr:nth-child(even){background:rgba(255,255,255,.02);}
.borradores{margin-top:8px;font-size:12.5px;}
.borradores summary{
  cursor:pointer;color:var(--text-dim);padding:5px 2px;user-select:none;
  list-style:none;display:inline-flex;align-items:center;gap:6px;
  transition:color .2s var(--suave);
}
.borradores summary::-webkit-details-marker{display:none;}
.borradores summary::before{content:"\25B8";display:inline-block;transition:transform .25s var(--suave);}
.borradores[open] summary::before{transform:rotate(90deg);}
.borradores summary:hover{color:var(--text);}
.borrador{
  border-left:3px solid var(--border);background:var(--panel-3);
  border-radius:0 9px 9px 0;padding:9px 12px;margin-top:7px;
}
.borrador-cab{font-size:11px;font-weight:700;margin-bottom:5px;letter-spacing:.3px;}
.borrador-txt{font-size:13px;line-height:1.55;color:var(--text-dim);max-height:260px;overflow-y:auto;}
.borrador-txt pre.code-block{font-size:12px;}
.bubble blockquote{border-left:3px solid var(--border);padding-left:11px;margin:0 0 9px;color:var(--text-dim);}
.bubble hr{border:none;border-top:1px solid var(--border);margin:11px 0;}
.code-wrap{position:relative;margin:10px 0;}
.code-head{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  background:linear-gradient(180deg,#1d1a22,var(--panel-2));
  border:1px solid var(--border);border-bottom:none;
  border-radius:8px 8px 0 0;padding:5px 11px;font-size:11px;color:var(--text-dim);
}
.code-head .lang{flex:1;font-weight:600;}
.code-head .carpeta{opacity:.6;font-size:10px;}
pre.code-block{
  background:var(--panel-3);border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:0 0 8px 8px;
  padding:12px 14px;overflow-x:auto;
  font-family:Consolas,Monaco,"Courier New",monospace;
  font-size:13px;line-height:1.55;color:#e8e6ed;white-space:pre;margin:0;
}
.copy-btn{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  font-size:11px;padding:2px 8px;border-radius:5px;cursor:pointer;
}
.copy-btn:hover{color:var(--text);border-color:var(--border-2);}
.gen-img{max-width:100%;border-radius:10px;border:1px solid var(--border);display:block;}
.img-actions{margin-top:8px;}
.img-actions a{font-size:12px;color:var(--accent);text-decoration:none;}
.img-actions a:hover{text-decoration:underline;}

/* ---------------- PIE ---------------- */
.inputbar{
  border-top:1px solid var(--border);padding:12px 20px 16px;flex-shrink:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.stat-strip{
  max-width:920px;margin:0 auto 9px;display:flex;flex-wrap:wrap;
  gap:0;font-size:12.5px;color:var(--text-dim);
}
.stat-item{padding:0 14px;border-right:1px solid var(--border);}
.stat-item:first-child{padding-left:0;}
.stat-item:last-child{border-right:none;}
.stat-item span{color:var(--text);font-weight:600;display:inline-block;}

.input-row{max-width:920px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
#userInput{
  flex:1;background:linear-gradient(180deg,#141218,var(--panel));
  border:1px solid var(--border);color:var(--text);
  padding:13px 16px;border-radius:14px;font-size:15px;resize:none;
  max-height:180px;line-height:1.45;overflow-y:auto;
  transition:border-color .22s var(--suave),box-shadow .22s var(--suave);
}
#userInput:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.16);}
.send-btn{
  width:46px;height:46px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;
  position:relative;overflow:hidden;
  box-shadow:0 3px 14px rgba(124,58,237,.4);
}
.send-btn:disabled{cursor:not-allowed;}
.send-btn.parar{background:linear-gradient(135deg,#b91c1c,#7f1d1d);}
.cursor{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:text-bottom;margin-left:1px;}
.send-btn.cargando{color:transparent;}
.send-btn.cargando::after{
  content:"";position:absolute;inset:0;margin:auto;
  width:19px;height:19px;border-radius:50%;
  border:2px solid rgba(255,255,255,.28);border-top-color:#fff;
  will-change:transform;
}
.mode-btn{
  width:46px;height:46px;border-radius:14px;border:1px solid var(--border);
  background:var(--panel);color:var(--text-dim);font-size:18px;cursor:pointer;
  flex-shrink:0;position:relative;overflow:hidden;
}
.mode-btn:hover{border-color:var(--border-2);}
.mode-btn.img-on{background:var(--accent);border-color:var(--accent);color:#0a090c;}
.mode-btn.code-on{background:#1d3b2a;border-color:#2a5c3f;color:#7fffb0;font-weight:700;}
.mode-btn.mic-on{background:#3b1d1d;border-color:#5c2a2a;color:#ff9a9a;}
.mode-btn.mic-escucha{background:var(--red);border-color:var(--red);color:#fff;}
.mode-btn.maxi-on{background:#2e2340;border-color:#4a3a6c;color:#d3b8ff;font-weight:700;}
#maxiBtn{font-size:12px;font-weight:700;}
.onda{
  position:absolute;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.3);transform:scale(0);will-change:transform,opacity;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#2f2c37;border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:#3a3742;}
::-webkit-scrollbar-track{background:transparent;}

/* ===============================================================
   ANIMACIONES
   Todas usan transform/opacity para ir por GPU.
   Al final se respeta prefers-reduced-motion.
   =============================================================== */

/* --- Entrada de mensajes --- */
@keyframes entrarBot{from{opacity:0;transform:translateY(14px) translateX(-10px)}to{opacity:1;transform:none}}
@keyframes entrarUsuario{from{opacity:0;transform:translateY(14px) translateX(10px)}to{opacity:1;transform:none}}
.msg{animation:entrarBot .34s var(--suave) both;}
.msg.user-msg{animation-name:entrarUsuario;}

@keyframes popAvatar{0%{opacity:0;transform:scale(.4) rotate(-14deg)}60%{transform:scale(1.12) rotate(4deg)}100%{opacity:1;transform:none}}
.avatar{animation:popAvatar .42s var(--muelle) .06s both;}

@keyframes crecerBurbuja{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.bubble{animation:crecerBurbuja .3s var(--suave) .08s both;transform-origin:left center;}
.user-msg .bubble{transform-origin:right center;}

@keyframes realce{0%{border-color:var(--accent)}100%{border-color:var(--border)}}
.bot-msg .bubble{animation:crecerBurbuja .3s var(--suave) .08s both,realce 1.5s ease .3s both;}

/* --- Espera / pensando --- */
@keyframes ola{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}
.dot{animation:ola 1.3s infinite ease-in-out;}
.dot:nth-child(2){animation-delay:.16s;}
.dot:nth-child(3){animation-delay:.32s;}

@keyframes brilloTexto{0%{background-position:200% 50%}100%{background-position:-200% 50%}}
.pensando{animation:brilloTexto 2s linear infinite;}

@keyframes barrido{0%{background-position:-260px 0}100%{background-position:260px 0}}
.bubble.thinking{
  background:linear-gradient(90deg,var(--panel) 0%,#1d1a22 50%,var(--panel) 100%);
  background-size:260px 100%;animation:barrido 1.8s linear infinite;
}

@keyframes girarCarga{to{transform:rotate(360deg)}}
.send-btn.cargando::after{animation:girarCarga .7s linear infinite;}

@keyframes pulsoEnviar{0%,100%{opacity:.55}50%{opacity:.85}}
.send-btn:disabled:not(.cargando){animation:pulsoEnviar 1.3s ease-in-out infinite;will-change:opacity;}

/* --- Desplegable de modelos --- */
@keyframes abrirMenu{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.model-dropdown.open{animation:abrirMenu .2s var(--suave) both;transform-origin:top right;}

@keyframes entrarOpcion{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.model-dropdown.open .dropdown-item{animation:entrarOpcion .26s var(--suave) both;}
.model-dropdown.open .dropdown-item:nth-child(2){animation-delay:.03s}
.model-dropdown.open .dropdown-item:nth-child(3){animation-delay:.06s}
.model-dropdown.open .dropdown-item:nth-child(4){animation-delay:.09s}
.model-dropdown.open .dropdown-item:nth-child(5){animation-delay:.12s}
.model-dropdown.open .dropdown-item:nth-child(6){animation-delay:.15s}
.model-dropdown.open .dropdown-item:nth-child(7){animation-delay:.18s}
.model-dropdown.open .dropdown-item:nth-child(8){animation-delay:.21s}

@keyframes latirPunto{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
.model-dropdown.open .dot-color{animation:latirPunto .5s ease .18s;}

@keyframes marcarSel{0%{box-shadow:inset 3px 0 0 transparent}100%{box-shadow:inset 3px 0 0 var(--accent)}}
.dropdown-item.sel{animation:marcarSel .3s var(--suave) forwards;}

/* --- Panel de ajustes --- */
@keyframes fundir{from{opacity:0}to{opacity:1}}
@keyframes entrarPanel{from{transform:translateX(100%);opacity:.4}to{transform:none;opacity:1}}
.settings-overlay.open{animation:fundir .2s ease both;}
.settings-overlay.open .settings-panel{animation:entrarPanel .3s var(--suave) both;}

@keyframes subirSeccion{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.settings-overlay.open .settings-body > *{animation:subirSeccion .32s var(--suave) both;}
.settings-overlay.open .settings-body > *:nth-child(1){animation-delay:.05s}
.settings-overlay.open .settings-body > *:nth-child(2){animation-delay:.08s}
.settings-overlay.open .settings-body > *:nth-child(3){animation-delay:.11s}
.settings-overlay.open .settings-body > *:nth-child(4){animation-delay:.14s}
.settings-overlay.open .settings-body > *:nth-child(5){animation-delay:.17s}
.settings-overlay.open .settings-body > *:nth-child(n+6){animation-delay:.2s}

/* --- Marca CECE AI --- */
@keyframes entrarLetra{
  0%{opacity:0;transform:translateY(-16px) rotate(-12deg) scale(.7)}
  70%{transform:translateY(2px) rotate(2deg) scale(1.06)}
  100%{opacity:1;transform:none}
}
.brand .ltr{animation:entrarLetra .5s var(--muelle) both;animation-delay:calc(var(--i) * .07s);transition:transform .25s var(--muelle),color .25s ease;}
@keyframes olaLetra{0%,100%{transform:translateY(0) scale(1);color:#fff}40%{transform:translateY(-9px) scale(1.15);color:var(--accent)}}
.brand:hover .ltr{animation:olaLetra .55s ease both;animation-delay:calc(var(--i) * .045s);}
.brand .ltr.esp{animation:none;}

/* --- Iconos --- */
.ico-gear{transition:transform .5s var(--muelle);}
#settingsBtn:hover .ico-gear{transform:rotate(180deg);}
@keyframes menear{0%,100%{transform:rotate(0)}25%{transform:rotate(-13deg)}75%{transform:rotate(13deg)}}
#clearBtn:hover .ico-trash{animation:menear .45s ease;}

/* --- Badges y modelos --- */
@keyframes latido{0%{transform:scale(1)}35%{transform:scale(1.2) rotate(-3deg)}100%{transform:scale(1)}}
.badge.late{animation:latido .45s var(--muelle);}
@keyframes respirar{0%,100%{opacity:.3}50%{opacity:.85}}
.model-pill::after{animation:respirar 3.4s ease-in-out infinite;}

/* --- Modos --- */
@keyframes cambiarModo{0%{transform:scale(1) rotate(0)}35%{transform:scale(.78) rotate(-18deg)}70%{transform:scale(1.18) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes aro{0%{box-shadow:0 0 0 0 rgba(255,63,158,.5)}100%{box-shadow:0 0 0 16px rgba(255,63,158,0)}}
.mode-btn.cambiando{animation:cambiarModo .5s var(--muelle),aro .55s ease;}
@keyframes latirModo{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.mode-btn.img-on,.mode-btn.code-on{animation:latirModo 2.4s ease-in-out infinite;will-change:transform;}

@keyframes parpadeo{50%{opacity:0}}
.cursor{animation:parpadeo .9s steps(1) infinite;}

/* --- Micrófono --- */
@keyframes escuchando{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.mode-btn.mic-escucha{animation:escuchando 1.4s ease-in-out infinite;}

/* --- Borradores de la fusión --- */
@keyframes abrirBorrador{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.borradores[open] .borrador{animation:abrirBorrador .28s var(--suave) both;}
.borradores[open] .borrador:nth-of-type(2){animation-delay:.05s;}
.borradores[open] .borrador:nth-of-type(3){animation-delay:.1s;}

/* --- Código e imágenes --- */
@keyframes desplegarCodigo{from{opacity:0;transform:translateY(8px) scaleY(.9)}to{opacity:1;transform:none}}
.code-wrap{animation:desplegarCodigo .32s var(--suave) both;transform-origin:top;}
@keyframes exitoCopia{0%{transform:scale(1)}45%{transform:scale(1.16);background:#1d3b2a;color:#7fffb0}100%{transform:scale(1)}}
.copy-btn.ok{animation:exitoCopia .55s ease;}
@keyframes revelarImagen{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.gen-img{animation:revelarImagen .5s var(--muelle) both;will-change:transform,opacity;}

/* --- Contadores y avisos --- */
@keyframes pulsoDato{0%{transform:scale(1)}40%{transform:scale(1.28);color:var(--accent)}100%{transform:scale(1)}}
.stat-item span.pulso{animation:pulsoDato .45s var(--muelle);}
@keyframes temblar{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.bubble.err{animation:temblar .42s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes destello{0%{box-shadow:0 0 0 0 rgba(255,63,158,.55)}100%{box-shadow:0 0 0 13px rgba(255,63,158,0)}}
.esf-btn.on,.preset-btn.on{animation:destello .5s ease;}
@keyframes expandirOnda{to{transform:scale(2.6);opacity:0}}
.onda{animation:expandirOnda .55s var(--suave) forwards;}
@keyframes entrarAviso{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.aviso{animation:entrarAviso .3s var(--suave) both;}
@keyframes entrarChip{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.carpeta-chip{animation:entrarChip .3s var(--muelle) both;}
@keyframes entrarConv{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.conv-row{animation:entrarConv .28s var(--suave) both;}

/* --- Interacción general --- */
.icon-btn,.mode-btn,.send-btn,.esf-btn,.preset-btn,.btn-secondary,.dropdown-item,.conv-load,.copy-btn,.conv-del,.mini-btn{
  transition:transform .15s var(--muelle),background .2s ease,border-color .2s ease,color .2s ease;
}
.icon-btn:active,.mode-btn:active,.send-btn:active,.btn-secondary:active,.esf-btn:active,.preset-btn:active{transform:scale(.92);}
.dropdown-item:hover{transform:translateX(4px);}
.btn-secondary:hover,.conv-load:hover{transform:translateY(-2px);}
.send-btn:not(:disabled):hover{transform:scale(1.08) rotate(6deg);}
.esf-btn:hover,.preset-btn:hover{transform:translateY(-2px);}
.conv-del:hover{transform:scale(1.12);}
.mini-btn:hover{transform:translateY(-1px);}

/* --- Accesibilidad: quien prefiera menos movimiento --- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ---------------- MÓVIL ---------------- */
@media (max-width:760px){
  .topbar{padding:11px 13px;gap:8px;flex-wrap:wrap;}
  .brand{font-size:19px;}
  .model-pill{padding:8px 11px;font-size:12.5px;}
  .model-pill .badge{font-size:10px;padding:2px 6px;}
  .model-dropdown{width:calc(100vw - 26px);right:auto;left:0;}
  .icon-btn{padding:8px 10px;font-size:13px;}
  .chat-area{padding:14px 12px;}
  .bubble{font-size:14.5px;padding:11px 14px;}
  .inputbar{padding:10px 12px 13px;}
  .stat-strip{gap:4px 0;font-size:11.5px;}
  .stat-item{padding:0 9px;}
  .stat-item:nth-child(3){border-right:none;}
  .settings-panel{width:100%;max-width:100%;}
  .esf-btn{font-size:11px;padding:8px 2px;}
  .preset-btn{font-size:10.5px;}
  .rep-nom{width:66px;font-size:11.5px;}
}

<script id="cece-app">
/* Cece AI — el programa va empaquetado en la línea de abajo y se desempaqueta al abrir el archivo.

((P, x) => {
  try {
    const copia = document.documentElement.cloneNode(true);   // el archivo tal cual (para descargar la copia protegida con contraseña)
    const b = atob(P), u = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; u[i] = b.charCodeAt(i) ^ x; }
    const [pagina, programa] = JSON.parse(new TextDecoder().decode(u));
    window.__ceceArchivo = copia;
    document.body.insertAdjacentHTML('afterbegin', pagina);
    const s = document.createElement('script');
    s.textContent = programa;
    document.body.appendChild(s);   // se ejecuta aquí mismo…
    s.remove();                     // …y deja de estar en la página
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', '<p style="font:16px/1.5 system-ui,sans-serif;padding:24px;color:#ff6b8a">No se ha podido abrir Cece AI: el archivo está incompleto o dañado. Vuelve a copiarlo.</p>');
  }
